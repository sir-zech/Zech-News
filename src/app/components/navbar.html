<nav class="navbar" [class.scrolled]="scrolled">
  <div class="nav-inner">
    <a routerLink="/" class="nav-brand">
      <div class="brand-icon">Z</div>
      <span>Zech<strong>News</strong></span>
    </a>

    <div class="nav-links" [class.open]="menuOpen">
      <a *ngFor="let cat of categories"
         [routerLink]="['/category', cat.value]"
         routerLinkActive="active"
         class="cat-link"
         (click)="menuOpen=false">
        <span class="cat-icon">{{ cat.icon }}</span>
        {{ cat.label }}
      </a>
      <a routerLink="/bookmarks"
         routerLinkActive="active"
         class="cat-link bookmark-link"
         (click)="menuOpen=false">
        <span class="cat-icon">🔖</span>
        Saved
        <span class="bk-count" *ngIf="bookmarkService.count() > 0">{{ bookmarkService.count() }}</span>
      </a>
      <div class="nav-search mobile-search">
        <input [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" placeholder="Search…" />
        <button (click)="onSearch()" class="search-btn">🔍</button>
      </div>
    </div>

    <div class="nav-actions">
      <div class="nav-search desktop-search">
        <input [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" placeholder="Search news…" />
        <button (click)="onSearch()" class="search-btn">🔍</button>
      </div>
      <a routerLink="/bookmarks" class="bookmark-btn desktop-only" title="Bookmarks">
        🔖
        <span class="bk-badge" *ngIf="bookmarkService.count() > 0">{{ bookmarkService.count() }}</span>
      </a>
      <button class="theme-btn" (click)="toggle()" [title]="dark ? 'Light mode' : 'Dark mode'">
        {{ dark ? '☀️' : '🌙' }}
      </button>
      <button class="hamburger" (click)="toggleMenu()" [class.open]="menuOpen">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<!-- Mobile Bottom Nav -->
<nav class="bottom-nav">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="btm-item">
    <span class="btm-icon">🏠</span>
    <span class="btm-label">Home</span>
  </a>
  <a routerLink="/category/technology" routerLinkActive="active" class="btm-item">
    <span class="btm-icon">💻</span>
    <span class="btm-label">Tech</span>
  </a>
  <a routerLink="/category/sports" routerLinkActive="active" class="btm-item">
    <span class="btm-icon">⚽</span>
    <span class="btm-label">Sports</span>
  </a>
  <a routerLink="/bookmarks" routerLinkActive="active" class="btm-item">
    <span class="btm-icon">🔖</span>
    <span class="btm-label">Saved</span>
  </a>
</nav>
