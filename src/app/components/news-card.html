<div class="card" (click)="openArticle($event)">
  <!-- Image present -->
  <div class="card-img" *ngIf="hasImage">
    <img
      [src]="article.image"
      [alt]="article.title"
      loading="lazy"
      (error)="onImgError()" />
    <div class="card-img-overlay"></div>
    <span class="source-badge">{{ article.source.name }}</span>
    <div class="card-actions">
      <button class="card-action-btn" (click)="toggleBookmark($event)" [title]="isBookmarked() ? 'Remove' : 'Save'">
        {{ isBookmarked() ? '🔖' : '🏷️' }}
      </button>
      <button class="card-action-btn" (click)="share($event)" title="Share">📤</button>
    </div>
  </div>

  <!-- No image — gradient placeholder -->
  <div class="card-img card-img-placeholder" *ngIf="!hasImage">
    <div class="placeholder-content">
      <span class="placeholder-initial">{{ domainInitial }}</span>
      <span class="placeholder-domain">{{ domainName }}</span>
    </div>
    <span class="source-badge">{{ article.source.name }}</span>
    <div class="card-actions">
      <button class="card-action-btn" (click)="toggleBookmark($event)" [title]="isBookmarked() ? 'Remove' : 'Save'">
        {{ isBookmarked() ? '🔖' : '🏷️' }}
      </button>
      <button class="card-action-btn" (click)="share($event)" title="Share">📤</button>
    </div>
  </div>

  <div class="card-body">
    <div class="card-smart" *ngIf="article.readingTime">
      <span class="reading-time">⏱️ {{ article.readingTime }}m</span>
      <span class="sentiment" *ngIf="article.sentiment">{{ sentimentIcon }}</span>
      <span class="api-src" *ngIf="article.apiSource && article.apiSource !== 'gnews'">{{ article.apiSource }}</span>
    </div>
    <h3>{{ article.title }}</h3>
    <p>{{ article.description }}</p>
    <div class="card-footer">
      <span class="date">📅 {{ article.publishedAt | date:'MMM d, y' }}</span>
      <span class="read-more">Read Summary →</span>
    </div>
  </div>
</div>
